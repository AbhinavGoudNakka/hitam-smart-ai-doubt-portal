<nav>

<p>Student Portal</p>

</div>

<div class="dashboard">

<button
onclick="logout()"
style="float:right;background:#e74c3c;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;">

🚪 Logout

</button>

<h1>🎓 Student Dashboard</h1>

<p>Ask your academic doubts and receive AI + Faculty verified answers.</p>

<br>

<div class="dashboard-card">

<h2 id="welcomeName">Welcome</h2>

<p><b>Roll Number:</b> <span id="welcomeRoll"></span></p>

<p><b>Department:</b> <span id="welcomeDept"></span></p>

<p><b>Year:</b> <span id="welcomeYear"></span></p>

<p><b>Section:</b> <span id="welcomeSection"></span></p>

</div>

<br>

<div class="dashboard-card">

<h2>Submit New Doubt</h2>

<input
id="category"
type="text"
placeholder="Subject">

<br><br>

<textarea
id="question"
rows="6"
placeholder="Enter your doubt..."></textarea>

<br><br>

<button onclick="submitDoubt()">

Submit Doubt

</button>

</div>

<br><br>

<h2>My Doubts</h2>

<button onclick="loadDoubts()">

🔄 Refresh

</button>

<br><br>

<div id="doubtList">

</div>

</div>

<footer style="text-align:center;padding:20px;color:gray;">

© 2026 HITAM Smart AI Doubt Resolution Portal

</footer>

<script src="auth.js"></script>

<script>

protectStudent();

</script>

<script src="script.js"></script>
