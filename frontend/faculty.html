<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Portal | HITAM AI</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav>

<div class="logo">

<img src="images/hitam-logo.png" alt="HITAM Logo">

<div>

<h2>HITAM</h2>

<p>Faculty Portal</p>

</div>

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="student.html">Students</a></li>

<li><a href="admin.html">Admin</a></li>

<li><a href="#" onclick="logout()">Logout</a></li>

</ul>

</nav>

<!-- ================= FACULTY DASHBOARD ================= -->

<div class="dashboard">

<div class="dashboard-header">

<div>

<h1>

<i class="fa-solid fa-chalkboard-user"></i>

Faculty Dashboard

</h1>

<p id="facultyWelcome">

Welcome Faculty

</p>

</div>

<button
class="hero-btn logout-btn"
onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

<!-- ================= STAT CARDS ================= -->

<div class="dashboard-cards">

<div class="dashboard-card">

<i class="fa-solid fa-book-open"></i>

<h2 id="totalDoubts">0</h2>

<p>Total Doubts</p>

</div>

<div class="dashboard-card">

<i class="fa-solid fa-hourglass-half"></i>

<h2 id="pendingDoubts">0</h2>

<p>Pending Doubts</p>

</div>

<div class="dashboard-card">

<i class="fa-solid fa-circle-check"></i>

<h2 id="verifiedDoubts">0</h2>

<p>Verified Doubts</p>

</div>

</div>

<!-- ================= SEARCH ================= -->

<input

class="search-box"

type="text"

id="search"

placeholder="🔍 Search Student / Subject / Question..."

onkeyup="searchDoubts()">

<br><br>

<!-- ================= TABLE ================= -->

<div class="table-container">

<table class="modern-table">

<thead>

<tr>

<th>ID</th>

<th>Student</th>

<th>Subject</th>

<th>Doubt</th>

<th>🤖 AI Answer</th>

<th>✍ Faculty Answer</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="doubtTable">

</tbody>

</table>

</div>

</div>

<script src="auth.js"></script>

<script>

protectFaculty();

</script>

<script src="faculty.js"></script>

</body>

</html>
