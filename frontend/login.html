<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HITAM Login</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="login-body">

<div class="login-container">

<div class="login-box">

<img src="images/hitam-logo.png" class="login-logo">

<h1>HITAM</h1>

<p>Hyderabad Institute of Technology and Management</p>

<h2>Smart AI Doubt Resolution Portal</h2>

<!-- Role first, so the rest of the form can adapt to it -->
<select id="role" onchange="roleChanged()">

<option value="student">Student</option>

<option value="faculty">Faculty</option>

<option value="admin">Admin</option>

</select>

<input
type="text"
id="username"
placeholder="Roll Number"
autocomplete="off"
onkeydown="if(event.key==='Enter'){login();}">

<!-- Hidden for students: student sign-in needs the Roll Number only -->
<input
type="password"
id="password"
placeholder="Password"
style="display:none;"
onkeydown="if(event.key==='Enter'){login();}">

<p id="loginHint"
style="font-size:13px;color:#555;margin:0 0 12px;line-height:1.5;">
Students: just enter your Roll Number. No password needed.
</p>

<button onclick="login()">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

<br><br>

<p style="font-size:14px;">
New student? <a href="register.html">Register here</a>
</p>

<p style="font-size:14px;">
<a href="admin-login.html">
<i class="fa-solid fa-user-shield"></i> Admin Login
</a>
</p>

<a href="index.html">&#11013; Back to Home</a>

</div>

</div>

<script src="auth.js"></script>
<script src="login.js"></script>

</body>
</html>
