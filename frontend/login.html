<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HITAM Login</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="login-body">

<div class="login-container">

<div class="login-box">

<img src="images/hitam-logo.png" class="login-logo">

<h1>HITAM</h1>

<p>Hyderabad Institute of Technology and Management</p>

<h2>Smart AI Doubt Resolution Portal</h2>

<input
type="text"
id="username"
placeholder="Roll No / Faculty ID / Admin Username">

<input
type="password"
id="password"
placeholder="Password">

<select id="role">

<option value="student">Student</option>

<option value="faculty">Faculty</option>

<option value="admin">Admin</option>

</select>

<button onclick="login()">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</div>

</div>

<script src="auth.js"></script>
<script src="login.js"></script>

</body>
</html>

</body>

</html>
