<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body class="login-body">

<div class="login-container">

<div class="login-box">

<img src="images/hitam-logo.png" class="login-logo">

<h1>Student Registration</h1>

<p>Hyderabad Institute of Technology and Management</p>

<input id="roll" placeholder="Roll Number">

<input id="name" placeholder="Student Name">

<input id="department" placeholder="Department">

<input id="year" placeholder="Year">

<input id="section" placeholder="Section">

<!-- Optional: students sign in with their Roll Number only. -->
<input id="password" type="password" placeholder="Password (optional)">

<p style="font-size:13px;color:#555;line-height:1.5;">
You can leave the password blank &ndash; students sign in with their Roll Number.
</p>

<button onclick="registerStudent()">

Register Student

</button>

<br><br>

<a href="login.html">

Already Registered? Login

</a>

</div>

</div>

<script src="register.js"></script>

</body>

</html>
