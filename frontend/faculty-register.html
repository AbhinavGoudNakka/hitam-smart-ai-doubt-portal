<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Registration | HITAM AI</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="login-body">

<div class="login-container">

<div class="login-box">

<img src="images/hitam-logo.png" class="login-logo">

<h1>HITAM</h1>

<p>Faculty Registration Portal</p>

<h2>Create Faculty Account</h2>

<input
type="text"
id="faculty_id"
placeholder="Faculty ID">

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="text"
id="department"
placeholder="Department">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="registerFaculty()">
<i class="fa-solid fa-user-plus"></i>
Register
</button>

<p id="msg" style="margin-top:15px;font-weight:bold;"></p>

<br>

<a href="faculty-login.html">
Already Registered? Login Here
</a>

</div>

</div>

<script>

const API = "https://hitam-ai-backend-m3ka.onrender.com";

async function registerFaculty(){

    const faculty_id=document.getElementById("faculty_id").value.trim();
    const name=document.getElementById("name").value.trim();
    const department=document.getElementById("department").value.trim();
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value.trim();

    if(
        faculty_id===""||
        name===""||
        department===""||
        email===""||
        password===""){
        alert("Please fill all fields.");
        return;
    }

    const response=await fetch(API+"/faculty/register",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            faculty_id,
            name,
            department,
            email,
            password

        })

    });

    const result=await response.json();

    if(response.ok){

        document.getElementById("msg").style.color="green";

        document.getElementById("msg").innerHTML=
        "✅ Registration Successful.<br>Waiting for Admin Approval.";

        setTimeout(()=>{

            window.location.href="faculty-login.html";

        },2500);

    }

    else{

        document.getElementById("msg").style.color="red";

        document.getElementById("msg").innerHTML=
        result.detail || "Registration Failed";

    }

}

</script>

</body>

</html>
